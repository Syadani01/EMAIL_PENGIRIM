name: Otomatis Kirim Lamaran Kerja

on:
  schedule:
    # Berjalan otomatis setiap Senin-Jumat (1-5) pada jam 2, 4, dan 7 UTC
    - cron: '0 2,4,7 * * 1-5'
    
  # Tombol manual agar Anda tetap bisa tes klik 'Run workflow' dari web GitHub
  workflow_dispatch: 

jobs:
  run-python-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil kode dari repositori
      uses: actions/checkout@v4

    - name: Menyiapkan Python di server GitHub
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Memasang modul pendukung
      run: |
        python -m pip install --upgrade pip

    - name: Eksekusi Kirim Email Lamaran
      env:
        EMAIL_PENGIRIM: ${{ secrets.EMAIL_PENGIRIM }}
        PASSWORD_APLIKASI: ${{ secrets.PASSWORD_APLIKASI }}
      run: python email_sender.py
